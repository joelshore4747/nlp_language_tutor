[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-adaptive-tutor"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["nlp_tutor*"]
exclude = ["web*", "data*", "notebooks*", "pages*", "scripts*", "tests*"]
include = ["api*"]
